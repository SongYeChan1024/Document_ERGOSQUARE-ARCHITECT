# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: "ERGOSQUARE: ARCHITECT"
site_description: "ERGOSQUARE: ARCHITECT 게임 기획·세계관·기술 문서"
site_url: "https://songyechan1024.github.io/Document_ERGOSQUARE-ARCHITECT/"
repo_url: "https://github.com/SongYeChan1024/Document_ERGOSQUARE-ARCHITECT"
repo_name: "SongYeChan1024/Document_ERGOSQUARE-ARCHITECT"
edit_uri: "edit/main/"

# MkDocs는 설정 파일의 상위 폴더를 docs_dir로 허용하지 않습니다.
# prepare_mkdocs.py가 번호 폴더의 원문을 Git 비추적 임시 폴더로 복사합니다.
docs_dir: docs/.generated
site_dir: site

theme:
  name: material
  language: ko
  logo: material/vector-square
  favicon: material/vector-square
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 밝은 테마로 전환

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/SongYeChan1024/Document_ERGOSQUARE-ARCHITECT"

